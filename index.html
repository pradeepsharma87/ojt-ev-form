<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172B68">
<meta name="color-scheme" content="light">
<title>Samagra Shiksha – OJT & EV Form</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Brand palette (project visual guideline) */
  --midnight:#172B68; --brick:#7E1B1E; --gold:#E7A740; --teal:#1E8481;
  --slate:#1D3256; --powder:#C3CDEB; --purple:#5B1E6B; --lilac:#A56A9A;
  --pearl:#F2ECE0; --card:#FAF8F3; --slategrey:#DCDCDC; --elephant:#B5B5AF; --biscuit:#BB8667;
  --text:#1D3256; --muted:#5A6378; --bg:#FFFFFF; --err:#7E1B1E;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:Lato,Aptos,"Noto Sans Devanagari","Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45;
  padding-left:6px;-webkit-text-size-adjust:100%;min-height:100vh}
/* Signature tri-colour stripe from the guide */
body:before{content:"";position:fixed;left:0;top:0;bottom:0;width:6px;z-index:50;
  background:linear-gradient(to bottom,var(--midnight) 0 33.3%,var(--brick) 33.3% 66.6%,var(--gold) 66.6% 100%)}
h1,h2,h3,.slab{font-family:"Roboto Slab",Georgia,"Noto Serif Devanagari",serif;color:var(--midnight);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 120px}

/* Header */
header{position:sticky;top:0;z-index:40;background:#fff;border-bottom:2px solid var(--gold)}
.hd{max-width:720px;margin:0 auto;padding:10px 14px 8px;display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0}
.brand h1{font-size:21px;line-height:1.1}
.logo{display:block;height:46px;width:auto;margin-bottom:2px}
.brand small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;border:1.5px solid var(--midnight);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:#fff;padding:6px 10px;font-size:14px;font-weight:700;color:var(--midnight);min-height:36px}
.lang button.on{background:var(--midnight);color:#fff}
.statusbar{max-width:720px;margin:0 auto;padding:0 14px 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--pearl);color:var(--slate)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.on .dot{background:var(--teal)} .chip.off .dot{background:var(--brick)}
.chip.pend{background:#FBEFD9;color:#6b4a10}
.chip.saved{background:transparent;color:var(--muted);font-weight:400}
.iconbtn{border:0;background:transparent;padding:6px;min-width:36px;min-height:36px;border-radius:8px;color:var(--midnight)}
.iconbtn svg{width:22px;height:22px;display:block}

/* Cards & sections */
.card{background:var(--card);border:1px solid #E7E1D3;border-radius:10px;padding:14px;margin:14px 0;box-shadow:0 1px 3px rgba(29,50,86,.08)}
.sec-title{font-size:19px;margin:18px 0 4px;display:flex;gap:8px;align-items:center}
.sec-title .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--midnight);color:#fff;font:700 14px/26px Lato,sans-serif;text-align:center}
.rule{height:2px;background:var(--gold);border:0;margin:6px 0 4px;width:64px}
.q{margin:14px 0}
.q label.ql{display:block;font-weight:700;color:var(--slate);margin-bottom:5px}
.q .req{color:var(--brick)}
.hint{font-size:13.5px;color:var(--muted);margin:-2px 0 6px}
input[type=text],input[type=tel],input[type=email],input[type=number],select,textarea{
  width:100%;border:1.5px solid var(--elephant);background:#fff;border-radius:8px;padding:11px 12px;min-height:48px;font-size:16px;outline:none}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--midnight);box-shadow:0 0 0 3px rgba(23,43,104,.15)}
input[readonly]{background:var(--pearl);color:var(--slate);font-weight:700}
.q.bad input,.q.bad select,.q.bad textarea{border-color:var(--err);background:#FFF7F7}
.errmsg{color:var(--err);font-size:13.5px;font-weight:700;margin-top:4px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:10px;background:var(--powder);color:var(--midnight);margin-left:6px;vertical-align:middle}
.badge.edit{background:#F6E2C0;color:#6b4a10}
.badge.red{background:#F3D9D9;color:var(--brick)}
.note{font-size:13.5px;background:#EEF1FA;border-left:4px solid var(--midnight);padding:8px 10px;border-radius:6px;margin:8px 0;color:var(--slate)}
.note.warn{background:#FDF3E1;border-color:var(--gold)}
.note.bad{background:#FBECEC;border-color:var(--brick);color:var(--brick)}

/* Typeahead */
.ta{position:relative}
.sugg{border:1.5px solid var(--midnight);border-top:0;border-radius:0 0 8px 8px;background:#fff;max-height:280px;overflow:auto;margin-top:-4px}
.sugg button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #EEE;background:#fff;padding:10px 12px;font-size:15px}
.sugg button:active{background:var(--powder)}
.sugg b{color:var(--midnight)} .sugg small{display:block;color:var(--muted);font-size:12.5px}
.sugg .more{padding:8px 12px;font-size:13px;color:var(--muted)}

/* Choice chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{flex:1 1 40%;display:flex;align-items:center;gap:8px;border:1.5px solid var(--elephant);border-radius:8px;padding:10px 12px;background:#fff;font-weight:700;min-height:48px}
.chips input{width:20px;height:20px;accent-color:var(--midnight)}
.chips label.on{border-color:var(--midnight);background:#EEF1FA}

/* Repeat groups */
.rep{border:1px solid #E7E1D3;border-left:4px solid var(--teal);border-radius:8px;background:#fff;padding:10px 12px;margin:10px 0}
.rep h3{font-size:16px;color:var(--teal)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid3 .q{margin:8px 0 0}
.grid3 label.ql{font-size:14px}
.tot{display:flex;justify-content:space-between;background:var(--midnight);color:#fff;border-radius:8px;padding:10px 12px;font-weight:700;margin-top:10px}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:10px;min-height:50px;padding:12px 16px;font-weight:700;font-size:16.5px;cursor:pointer}
.btn.pri{background:var(--midnight);color:#fff}
.btn.gold{background:var(--gold);color:var(--slate)}
.btn.teal{background:var(--teal);color:#fff}
.btn.out{background:#fff;color:var(--midnight);border:1.5px solid var(--midnight)}
.btn.ghost{background:transparent;color:var(--brick);min-height:40px;font-size:14.5px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px}
.row>*{flex:1}
.navbar{position:fixed;left:6px;right:0;bottom:0;background:#fff;border-top:1px solid var(--slategrey);z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.navbar .in{max-width:720px;margin:0 auto}
.prog{height:6px;background:var(--pearl);border-radius:4px;overflow:hidden;margin:10px 0 2px}
.prog i{display:block;height:100%;background:var(--gold)}
.steptxt{font-size:13px;color:var(--muted)}
.modebar{display:flex;gap:6px;margin-top:10px}
.modebar button{flex:1;border:1.5px solid var(--slategrey);background:#fff;border-radius:8px;padding:7px;font-size:13.5px;font-weight:700;color:var(--muted)}
.modebar button.on{border-color:var(--teal);color:var(--teal);background:#EAF5F5}

/* Home & lists */
.hello{margin:16px 0 4px;font-size:22px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{border:1px solid #E7E1D3;background:var(--card);border-radius:10px;padding:12px;text-align:left;min-height:84px}
.tile .n{font:700 28px/1 "Roboto Slab",serif;color:var(--midnight)}
.tile .l{font-size:13.5px;color:var(--slate);margin-top:6px;font-weight:700}
.tile.p .n{color:var(--brick)} .tile.s .n{color:var(--teal)}
.item{border:1px solid #E7E1D3;background:#fff;border-radius:10px;padding:12px;margin:10px 0}
.item b{color:var(--midnight)}
.item .meta{font-size:13px;color:var(--muted);margin:3px 0 8px}
.item .acts{display:flex;gap:8px}
.item .acts .btn{min-height:40px;font-size:14.5px;padding:8px}
.tabs{display:flex;gap:6px;margin:14px 0 4px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;border:0;border-bottom:3px solid transparent;background:transparent;padding:8px 6px;font-weight:700;color:var(--muted);font-size:14.5px}
.tabs button.on{color:var(--midnight);border-color:var(--gold)}
.rv{font-size:14.5px}
.rv dt{color:var(--muted);font-size:13px;margin-top:8px}
.rv dd{margin:0;font-weight:700;color:var(--slate);word-break:break-word}
.rv .edl{float:right;border:0;background:transparent;color:var(--teal);font-weight:700;font-size:14px;padding:4px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--slate);color:#fff;padding:10px 16px;border-radius:8px;font-size:14.5px;z-index:99;max-width:90%;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.done{text-align:center;padding:30px 10px}
.done .ic{width:72px;height:72px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff}
.instr{margin:0;padding-left:22px}.instr li{margin:0 0 9px;padding-left:2px}.instr li::marker{color:var(--brick);font-weight:700}
.order{border-left:4px solid var(--brick)}.order .meta,.vtpinfo{font-size:13.5px;color:var(--muted)}
.sub{font-weight:700;color:var(--slate);font-size:14.5px;margin:10px 0 0;padding-top:8px;border-top:1px dashed var(--slategrey)}
.sub:first-of-type{border-top:0;padding-top:0}
.tl{display:inline-block;margin-top:5px;background:#FBEFD9;color:#6b4a10;font-weight:700;font-size:13.5px;padding:3px 9px;border-radius:12px}
.hide{display:none!important}
footer{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}
</style>
</head>

/* ================= STATE / STORAGE ================= */
function ls(k, v){ try{ if (v === undefined){ var x = localStorage.getItem(k); return x ? JSON.parse(x) : null; } localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
var S = {
  lang: ls('sl_lang') || 'hi',
  mode: ls('sl_mode') || 'step',
  user: ls('sl_user') || {name:'', phone:''},
  url: ls('sl_url') || SCRIPT_URL,
  vtp: ls('sl_vtp') || VTP_DEFAULT, vtpLocal: ls('sl_vtp_local') || [], orders: ls('sl_orders') || DEPT_ORDERS_DEFAULT, general: ls('sl_general') || null, instr: ls('sl_instr') || null,
  recs: ls('sl_recs') || [],
  cur: null, step: 0, showErr: false, errs: {}, view: 'info', tab: 'draft', syncing: false, lastSaved: null, filterD: ''
};
function persist(){ ls('sl_recs', S.recs); }
(function migrate(){ S.recs.forEach(function(r){ var d = r.data; if (!d) return;
  if (d.vtp==='__other'){ d.vtp = d.vtpOther || ''; } delete d.vtpOther;
  if (VTP_ALIAS[d.vtp]) d.vtp = VTP_ALIAS[d.vtp];
  if (PRE.DOLD[d.district]) d.district = PRE.DOLD[d.district];
  if (PRE.SOLD[d.sector]) d.sector = PRE.SOLD[d.sector];
  if (r.preload && PRE.DOLD[r.preload.district]){ r.preload.district = PRE.DOLD[r.preload.district]; var ps = BY_UDISE[r.preload.udise]; if (ps){ r.preload.block = ps[3]; if (d.block && d.block.toUpperCase()===d.block && d.block.toLowerCase()===ps[3].toLowerCase()) d.block = ps[3]; } }
  for (var c in d.enrol){ var e = d.enrol[c]; if (e && e.b!==undefined && e.vb===undefined){ e.vb = e.b; e.vg = e.g; e.cb = ''; e.cg = ''; delete e.b; delete e.g; } }
  if (+d.nPlaces < 4) d.nPlaces = '4'; while (d.places.length < 4) d.places.push({}); }); })();
function t(k, o){ var s = (T[S.lang][k] || T.en[k] || k); if (typeof s !== 'string') return s; if (o) for (var p in o) s = s.replace('{'+p+'}', o[p]); return s; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function $(id){ return document.getElementById(id); }
function nowISO(){ var d = new Date(), z = -d.getTimezoneOffset(), p = function(n){ return (n<10?'0':'')+n; };
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }
function fmt(ts){ if(!ts) return ''; return ts.slice(8,10)+'/'+ts.slice(5,7)+' '+ts.slice(11,16); }
function uid(){ return 'SL-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2,6).toUpperCase(); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function blankData(){ return {udise:'',school:'',district:'',block:'',vtName:'',vtPhone:'',vtGender:'',sector:'',vtp:'',classes:[],enrol:{},nPlaces:'4',places:[{},{},{},{}]}; }
function findRec(id){ for (var i=0;i<S.recs.length;i++) if (S.recs[i].id===id) return S.recs[i]; return null; }
function count(st){ var n=0; S.recs.forEach(function(r){ if(r.status===st) n++; }); return n; }

/* ================= HEADER / STATUS ================= */
function renderHeader(){
  $('subTitle').textContent = t('sub'); $('brandT').alt = t('brand');
  $('lenBtn').className = S.lang==='en' ? 'on' : ''; $('lhiBtn').className = S.lang==='hi' ? 'on' : '';
  document.documentElement.lang = S.lang;
  var on = navigator.onLine, p = count('pending');
  var h = '<span class="chip '+(on?'on':'off')+'"><span class="dot"></span>'+t(on?'online':'offline')+'</span>';
  if (p) h += '<span class="chip pend">'+(S.syncing ? t('sending') : t('pending',{n:p}))+'</span>';
  if (S.view==='form' && S.lastSaved) h += '<span class="chip saved">✓ '+t('saved',{t:S.lastSaved.slice(11,16)})+'</span>';
  $('statusBar').innerHTML = h;
}
function toast(msg){ var d=document.createElement('div'); d.className='toast'; d.textContent=msg; document.body.appendChild(d); setTimeout(function(){ d.parentNode && d.parentNode.removeChild(d); }, 3200); }

/* ================= VIEWS ================= */
function go(v){ S.view = v; render(); window.scrollTo(0,0); }
function render(){
  renderHeader();
  $('navbar').className = 'navbar hide';
  if (!S.user.name) return viewSettings(true);
  if (S.view==='info') return viewInfo();
  if (S.view==='home') return viewHome();
  if (S.view==='list') return viewList();
  if (S.view==='settings') return viewSettings(false);
  if (S.view==='form') return viewForm();
  if (S.view==='done') return viewDone();
}

function viewHome(){
  var p = count('pending');
  var h = '<h2 class="hello">'+t('hello',{n:esc(S.user.name)})+'</h2><hr class="rule">';
  if (!S.url) h += '<div class="note bad">'+t('noServer')+'</div>';
  h += '<button class="btn pri" style="margin-top:14px" onclick="newForm()">＋ '+t('home_new')+'</button>';
  h += '<div class="tiles">'+
    '<button class="tile" onclick="openList(\'draft\')"><div class="n">'+count('draft')+'</div><div class="l">'+t('tile_draft')+'</div></button>'+
    '<button class="tile p" onclick="openList(\'pending\')"><div class="n">'+p+'</div><div class="l">'+t('tile_pend')+'</div></button>'+
    '<button class="tile s" onclick="openList(\'sent\')" style="grid-column:1/-1"><div class="n">'+count('sent')+'</div><div class="l">'+t('tile_sent')+'</div></button></div>';
  if (p) h += '<button class="btn gold" onclick="syncAll(true)">⇪ '+t('sendAll',{n:p})+'</button>';

  h += '<button class="btn out" style="margin-top:12px" onclick="go(\'info\')">ⓘ '+t('seeInfo')+'</button>';
  h += '<footer>'+t('state')+' · v'+APP_VERSION+'</footer>';
  $('view').innerHTML = h;
}

/* Opening screen: 1) General instructions + timeline  2) Form instructions  3) Letter references  → Next */
function viewInfo(){
  var h = '';
  if (!S.url) h += '<div class="note bad" style="margin-top:12px">'+t('noServer')+'</div>';
  // 1. General instructions & timeline
  var gen = (S.general && S.general[S.lang] && S.general[S.lang].length) ? S.general[S.lang] : GENERAL_DEFAULT[S.lang];
  h += secT(1, t('genT')) + '<div class="card"><ol class="instr">'+gen.map(function(x){
    return '<li>'+esc(x.text)+(x.date ? '<div><span class="tl">⏱ '+t('timeline')+': '+esc(x.date)+'</span></div>' : '')+'</li>'; }).join('')+'</ol></div>';
  // 2. Form instructions
  var ins = (S.instr && S.instr[S.lang] && S.instr[S.lang].length) ? S.instr[S.lang] : t('instr');
  h += secT(2, t('instrT')) + '<div class="card"><ol class="instr">'+ins.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ol></div>';
  // 3. Letter references
  var ords = (S.orders || []).filter(function(o){ return o && (o.ref || o.subject_hi || o.subject_en); });
  h += secT(3, t('ordersT'));
  if (!ords.length) h += '<div class="card" style="color:var(--muted)">'+t('noOrders')+'</div>';
  ords.forEach(function(o, i){
    var sub = S.lang==='hi' ? (o.subject_hi || o.subject_en) : (o.subject_en || o.subject_hi);
    var det = S.lang==='hi' ? (o.details_hi || o.details_en) : (o.details_en || o.details_hi);
    h += '<div class="card order">'+(i===0 ? '<span class="badge red" style="margin:0 0 6px">'+t('newTag')+'</span>' : '')+
      '<div class="meta">'+(o.ref ? t('refNo')+': <b>'+esc(o.ref)+'</b>' : '')+(o.date ? (o.ref?' · ':'')+t('dated')+': <b>'+esc(o.date)+'</b>' : '')+'</div>'+
      (sub ? '<h3 style="font-size:16.5px;margin:6px 0 4px">'+esc(sub)+'</h3>' : '')+
      (det ? '<p style="margin:6px 0;white-space:pre-line">'+esc(det)+'</p>' : '')+
      (o.pdf ? '<button class="btn out" style="min-height:42px;font-size:15px;margin-top:6px" onclick="openPdf('+i+')">📄 '+t('viewPdf')+'</button>' : '')+'</div>';
  });
  h += '<footer>'+t('state')+' · v'+APP_VERSION+'</footer>';
  $('view').innerHTML = h;
  $('navIn').innerHTML = '<button class="btn pri" onclick="go(\'home\')">'+t('instrNext')+' ›</button>';
  $('navbar').className = 'navbar';
  precachePdfs();
}
function secT(n, title){ return '<h2 class="sec-title" style="margin-top:18px"><span class="num">'+n+'</span>'+title+'</h2><hr class="rule">'; }
function openPdf(i){
  var o = S.orders[i]; if (!o || !o.pdf) return;
  var local = !/^https?:/i.test(o.pdf);
  if (!local && !navigator.onLine){ toast(t('pdfNet')); return; }
  window.open(o.pdf, '_blank');
}
function precachePdfs(){ // letters uploaded next to index.html are cached so they open offline too
  if (!navigator.onLine || !window.caches) return;
  (S.orders||[]).forEach(function(o){ if (o && o.pdf && !/^https?:/i.test(o.pdf)) fetch(o.pdf).catch(function(){}); });
}

function openList(tab){ S.tab = tab; go('list'); }
function viewList(){
  var tabs = ['draft','pending','sent'], names = {draft:'tile_draft',pending:'tile_pend',sent:'tile_sent'};
  var h = '<div class="tabs">'+tabs.map(function(k){ return '<button class="'+(S.tab===k?'on':'')+'" onclick="openList(\''+k+'\')">'+t(names[k])+' ('+count(k)+')</button>'; }).join('')+'</div>';
  var list = S.recs.filter(function(r){ return r.status===S.tab; }).sort(function(a,b){ return (b.updatedAt||'') > (a.updatedAt||'') ? 1 : -1; });
  if (S.tab==='pending' && list.length) h += '<button class="btn gold" style="margin:10px 0" onclick="syncAll(true)">⇪ '+t('sendAll',{n:list.length})+'</button>';
  if (!list.length) h += '<div class="card" style="text-align:center;color:var(--muted)">'+t('empty')+'</div>';
  list.forEach(function(r){
    var d = r.data;
    h += '<div class="item"><b>'+esc(d.school || t('untitled'))+'</b>'+(r.recordType==='Correction'?'<span class="badge edit">'+t('edited')+'</span>':'')+
      '<div class="meta">'+esc(d.udise)+(d.district?' · '+esc(d.district):'')+(d.vtName?' · VT: '+esc(d.vtName):'')+'<br>'+
      (r.status==='sent' ? t('sentAt',{t:fmt(r.sentAt)}) : r.status==='pending' ? t('savedAt',{t:fmt(r.submittedAt)}) : t('draftAt',{t:fmt(r.updatedAt)}))+
      (r.status==='pending' && r.lastError ? '<br><span style="color:var(--brick)">'+esc(t('retry',{e:r.lastError}))+'</span>' : '')+'</div><div class="acts">';

/* ---- input binding ---- */
function bindForm(){
  var v = $('view');
  v.oninput = function(e){ var el = e.target, k = el.getAttribute('data-k'); if (!k) return;
    var val = el.value;
    if (el.type==='tel'){ val = val.replace(/\D/g,''); if (k==='udise'){ if (val.length===11 && val[0]==='0') val = val.slice(1); val = val.slice(0,10); } else if (/\.pin$/.test(k)) val = val.slice(0,6); else val = val.slice(0,10); if (val!==el.value) el.value = val; }
    if (el.type==='number' && val.length>4){ val = val.slice(0,4); el.value = val; }
    setP(k, val); touch();
    if (k.indexOf('enrol.')===0){ var c = k.split('.')[1], en = S.cur.data.enrol[c]||{}; if ($('totc'+c)) $('totc'+c).value = tot(en,'c'); if ($('totv'+c)) $('totv'+c).value = tot(en,'v'); var g=$('gTot'); if (g) g.innerHTML = grand(); }
    if (k==='vtp'){ onVtp(val); var vi=$('vtpInfo'); if (vi) vi.innerHTML = vtpInfo(); }
    if (k==='udise') onUdise(val);
    if (k==='school') onSchool(val);
    if (S.showErr && S.errs[k]){ delete S.errs[k]; var q = el.closest ? el.closest('.q') : null; if (q){ q.className='q'; var m=q.querySelector('.errmsg'); if(m) m.parentNode.removeChild(m); } }
  };
  v.onchange = function(e){ var el = e.target;
    if (el.id==='fD'){ S.filterD = el.value; return; }
    if (el.hasAttribute('data-cls')){ var c = +el.getAttribute('data-cls'), cl = S.cur.data.classes, ix = cl.indexOf(c);
      if (el.checked && ix<0) cl.push(c); if (!el.checked && ix>=0) cl.splice(ix,1);
      if (!S.cur.data.enrol[c]) S.cur.data.enrol[c] = {cb:'',cg:'',vb:'',vg:''}; saveNow(); rerender(); return; }
    var k = el.getAttribute('data-k'); if (!k) return;
    if (el.tagName==='SELECT'){ setP(k, el.value);
      if (k==='nPlaces'){ var pl = S.cur.data.places; while (pl.length < +el.value) pl.push({}); } // keep extra entries in memory until submit
      saveNow(); if (el.getAttribute('data-re') || S.cur.preload || S.cur.original) rerender(); }
  };
}
function rerender(){ var y = window.pageYOffset; viewForm(); window.scrollTo(0,y); }

/* ---- typeahead ---- */
function onUdise(v){
  var box = $('sgU');
  if (v.length===10 && BY_UDISE[v]){ if (!S.cur.preload || S.cur.preload.udise!==v) pick(v); else box.className='sugg hide'; return; }
  if (v.length<2){ box.className='sugg hide'; return; }
  var res = [], starts = [];
  for (var i=0;i<SCH.length;i++){ var s = SCH[i]; if (S.filterD && DIST[s[2]]!==S.filterD) continue; var ix = s[0].indexOf(v); if (ix===0) starts.push(s); else if (ix>0) res.push(s); }
  showSugg(box, starts.concat(res));
}
function onSchool(v){
  var box = $('sgS'), q = v.trim().toLowerCase();
  if (q.length<2){ box.className='sugg hide'; return; }
  var words = q.split(/\s+/), res=[];
  for (var i=0;i<SCH.length;i++){ var s=SCH[i]; if (S.filterD && DIST[s[2]]!==S.filterD) continue; var ok=true;
    for (var w=0; w<words.length; w++) if (s[4].indexOf(words[w])<0 && s[0].indexOf(words[w])<0){ ok=false; break; }
    if (ok) res.push(s); }
  showSugg(box, res);
}
function showSugg(box, res){
  var max = 40, h='';
  if (!res.length) h = '<div class="more">'+t('noMatch')+'</div>';
  res.slice(0,max).forEach(function(s){ h += '<button type="button" data-u="'+s[0]+'"><b>'+esc(s[1])+'</b><small>'+s[0]+' · '+esc(dLabel(DIST[s[2]]))+(s[3]?' · '+esc(s[3]):'')+'</small></button>'; });
  if (res.length>max) h += '<div class="more">'+t('showing',{a:max,b:res.length})+'</div>';
  box.innerHTML = h; box.className='sugg';
  box.onclick = function(e){ var b = e.target.closest ? e.target.closest('button') : null; if (b) pick(b.getAttribute('data-u')); };
}
function pick(u){
  var s = BY_UDISE[u], d = S.cur.data;
  d.udise = s[0]; d.school = s[1]; d.district = DIST[s[2]]; d.block = s[3];

/* ---- VTP: one open list, not tied to district / sector / school ---- */
function normV(x){ return String(x||'').toLowerCase().replace(/[^a-z0-9ऀ-ॿ]+/g,' ').trim(); }
// key used to treat spelling variants as the same VTP ("Pvt Ltd" / "Private Limited" / dots / case ignored)
function vKey(x){ x = VTP_ALIAS[String(x||'').trim()] || x; return normV(x).replace(/\b(pvt|private|ltd|limited|p)\b/g,' ').replace(/\s+/g,' ').trim(); }
function canonVtp(v){ var k = vKey(v); if (!k) return String(v||'').trim(); var hit = vtpList().filter(function(x){ return vKey(x)===k; })[0]; return hit || String(v||'').trim().replace(/\s+/g,' '); }
function vtpList(){
  var seen = {}, out = [];
  VTP_DEFAULT.concat(S.vtp, S.vtpLocal).forEach(function(x){ x = String(x||'').trim(); x = VTP_ALIAS[x] || x; var n = vKey(x); if (x && !seen[n]){ seen[n]=1; out.push(x); } });
  return out.sort(function(a,b){ return a.toLowerCase() < b.toLowerCase() ? -1 : 1; });
}
function vtpKnown(v){ var n = vKey(v); if (!n) return false; return vtpList().some(function(x){ return vKey(x)===n; }); }
function vtpInfo(){
  var v = S.cur.data.vtp, n = vtpList().length;
  if (v && !vtpKnown(v)) return '<span class="badge edit" style="margin:4px 0 0">'+t('vtpNew')+'</span>';
  return n ? t('vtpCount',{n:n}) : t('vtpEmpty');
}
function onVtp(v){
  var box = $('sgV'); if (!box) return;
  var words = normV(v).split(' ').filter(Boolean), all = vtpList();
  var res = all.filter(function(x){ var n = normV(x); return words.every(function(w){ return n.indexOf(w)>=0; }); });
  if (!all.length || (v && res.length===1 && normV(res[0])===normV(v))){ box.className='sugg hide'; return; }
  var h = '';
  res.slice(0,80).forEach(function(x){ h += '<button type="button" data-v="'+esc(x)+'"><b>'+esc(x)+'</b></button>'; });
  if (!res.length){ box.className='sugg hide'; return; }
  box.innerHTML = h; box.className = 'sugg';
  box.onclick = function(e){ var b = e.target.closest ? e.target.closest('button') : null; if (!b) return;
    S.cur.data.vtp = b.getAttribute('data-v'); saveNow(); box.className='sugg hide';
    var f = $('fVtp'); if (f) f.value = S.cur.data.vtp; var vi = $('vtpInfo'); if (vi) vi.innerHTML = vtpInfo(); };
}
function rememberVtp(v){ v = String(v||'').trim(); if (v && !vtpKnown(v)){ S.vtpLocal.push(v); ls('sl_vtp_local', S.vtpLocal); } }

/* ---- validation ---- */
var RE_PH = /^[6-9]\d{9}$/, RE_PH_ANY = /^\d{10}$/, RE_EM = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function validate(step){
  var d = S.cur.data, e = {}, R = t('req');
  function rq(k){ if (String(getP(k)).trim()==='') e[k] = R; }
  if (step===0){ rq('udise'); if (d.udise && d.udise.length!==10) e.udise = t('e_udise'); rq('school'); rq('district'); rq('block'); }
  if (step===1){ rq('vtName'); if (!RE_PH.test(d.vtPhone)) e.vtPhone = d.vtPhone ? t('e_phone') : R; rq('vtGender'); }
  if (step===2){ rq('sector'); rq('vtp'); }
  if (step===3){ if (!d.classes.length) e.classes = t('e_cls');
    d.classes.forEach(function(c){ var en = d.enrol[c]||{}, k = 'enrol.'+c+'.'; ['cb','cg','vb','vg'].forEach(function(x){ var v = en[x]; if (v===''||v==null||isNaN(+v)||+v<0) e[k+x] = t('e_num'); });
      if (!e[k+'vb'] && !e[k+'cb'] && +en.vb > +en.cb) e[k+'vb'] = t('e_veMore'); if (!e[k+'vg'] && !e[k+'cg'] && +en.vg > +en.cg) e[k+'vg'] = t('e_veMore'); }); }
  if (step===4){ for (var p=0;p<+d.nPlaces;p++){ var b='places.'+p+'.', x=d.places[p]||{};
    rq(b+'owner'); rq(b+'addr'); if (!/^[1-9]\d{5}$/.test(x.pin||'')) e[b+'pin'] = x.pin ? t('e_pin') : R; if (!RE_PH_ANY.test(x.phone||'')) e[b+'phone'] = x.phone ? t('e_phone') : R;
    if (x.email && !RE_EM.test(x.email.trim())) e[b+'email'] = t('e_email'); } }
  return e;
}
function validateAll(){ var all = {}, first = -1; for (var i=0;i<5;i++){ var e = validate(i); for (var k in e){ all[k]=e[k]; if (first<0) first=i; } } return {errs:all, first:first}; }
function scrollToErr(){ setTimeout(function(){ var b = document.querySelector('.q.bad, .errmsg'); if (b) b.scrollIntoView({block:'center'}); }, 30); }
function stepGo(dir){
  saveNow();
  if (dir>0){ var e = validate(S.step); if (Object.keys(e).length){ S.errs = e; S.showErr = true; rerender(); toast(t('fix')); scrollToErr(); return; } }
  S.showErr = false; S.errs = {}; S.step += dir; render(); window.scrollTo(0,0);
}

/* ---- change log (preload edits + corrections) ---- */
var FL = {udise:'UDISE Code',school:'School Name',district:'District',block:'Block',vtName:'VT Name',vtPhone:'VT Phone',vtGender:'VT Gender',sector:'VE Sector',vtp:'VTP Name',classes:'Classes',enrol:'Enrolment',nPlaces:'No. of OJT/EV Places',places:'OJT/EV Places'};
function cleanData(d){ var x = clone(d); x.places = x.places.slice(0, +x.nPlaces); var en = {}; x.classes.forEach(function(c){ en[c] = x.enrol[c]; }); x.enrol = en; return x; }
function changeList(r){
  var out = [], d = r.data;
  if (r.preload) ['udise','school','district','block'].forEach(function(k){ if (String(r.preload[k]||'')!==String(d[k]||'')) out.push('Preload '+FL[k]+': "'+(r.preload[k]||'')+'" → "'+(d[k]||'')+'"'); });
  if (r.original){ var a = cleanData(r.original), b = cleanData(d);
    Object.keys(FL).forEach(function(k){ if (r.preload && ['udise','school','district','block'].indexOf(k)>=0) { if (String(a[k])!==String(b[k]) && String(r.preload[k])===String(a[k])) return; }
      if (JSON.stringify(a[k])!==JSON.stringify(b[k])) out.push(FL[k]+(typeof b[k]==='object' ? ' changed' : ': "'+a[k]+'" → "'+b[k]+'"')); }); }
  return out;
}

/* ---- submit ---- */
function submitForm(){
  saveNow();
  var v = validateAll();
  if (v.first>=0){ S.errs = v.errs; S.showErr = true; if (S.mode==='step') S.step = v.first; render(); toast(t('fix')); scrollToErr(); return; }
  var r = S.cur; r.status = 'pending'; r.submittedAt = nowISO(); r.updatedAt = r.submittedAt; r.lastError = '';
  var ch = changeList(r); r.changes = ch; r.data.vtp = canonVtp(r.data.vtp); r.vtpNew = !vtpKnown(r.data.vtp); rememberVtp(r.data.vtp);
  persist(); S.showErr=false; S.doneId = r.id; go('done');

}

function pdfBtn(id){ return '<button class="btn teal" onclick="downloadPdf(\''+id+'\')">⤓ '+t('pdf')+'</button>'; }
function downloadPdf(id){
  var r = findRec(id); if (!r) return;
  if (r===S.cur) saveNow();
  toast(t('pdfMaking'));
  var img = new Image();
  img.onload = function(){ setTimeout(function(){ try { buildPdf(r, img); } catch(e){ toast(t('pdfFail')); } }, 30); };
  img.onerror = function(){ try { buildPdf(r, null); } catch(e){ toast(t('pdfFail')); } };
  img.src = LOGO_PDF;
}
function buildPdf(r, logo){
  var W = 794, H = 1123, SC = 2;                       // A4 at 96 dpi, drawn at 2x (≈190 dpi)
  var cv = document.createElement('canvas'); cv.width = W*SC; cv.height = H*SC;
  var cx = cv.getContext('2d');
  var P = PDF_T[S.lang], fs = 13, h;
  for (var tries = 0; tries < 8; tries++){             // shrink text until the whole entry fits one page
    h = drawPage(cx, r, logo, P, fs, true, W, H, SC);
    if (h <= H - 40 || fs <= 8.5) break;
    fs -= 0.75;
  }
  drawPage(cx, r, logo, P, fs, false, W, H, SC);
  var jpg = cv.toDataURL('image/jpeg', 0.88);
  var blob = jpegToPdf(jpg, cv.width, cv.height);
  var d = r.data, name = 'OJT_EV_' + (d.udise||'NA') + '_' + String(d.vtName||'VT').replace(/[^A-Za-z0-9\u0900-\u097F]+/g,'_').slice(0,30) + '_' + (r.submittedAt||nowISO()).slice(0,10) + '.pdf';
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.parentNode && a.parentNode.removeChild(a); }, 4000);
  toast(t('pdfDone'));
}
function drawPage(cx, r, logo, P, fs, dry, W, H, SC){
  var d = cleanData(r.data), M = 34, X = M + 8, CW = W - X - M, y = 0;
  var FONT = '"Noto Sans Devanagari","Lato","Roboto",Arial,sans-serif';
  cx.setTransform(SC,0,0,SC,0,0);
  if (!dry){ cx.fillStyle = '#FFFFFF'; cx.fillRect(0,0,W,H);
    cx.fillStyle = '#172B68'; cx.fillRect(0,0,8,H/3); cx.fillStyle = '#7E1B1E'; cx.fillRect(0,H/3,8,H/3); cx.fillStyle = '#E7A740'; cx.fillRect(0,2*H/3,8,H/3); }
  function font(sz, bold){ cx.font = (bold?'700 ':'400 ') + sz + 'px ' + FONT; }
  function wrap(txt, w, sz, bold){
    font(sz, bold); txt = String(txt==null?'':txt); var out = [];
    txt.split('\n').forEach(function(para){
      var words = para.split(/\s+/), line = '';
      words.forEach(function(wd){
        while (cx.measureText(wd).width > w && wd.length > 1){        // very long word (e-mail etc.) – hard break
          var k = wd.length; while (k > 1 && cx.measureText((line?line+' ':'') + wd.slice(0,k)).width > w) k--;
          if (k <= 1 && line){ out.push(line); line=''; continue; }
          out.push((line?line+' ':'') + wd.slice(0,k)); line=''; wd = wd.slice(k);
        }
        var test = line ? line + ' ' + wd : wd;
        if (cx.measureText(test).width > w && line){ out.push(line); line = wd; } else line = test;
      });
      out.push(line);
    });
    return out;
  }
  function text(str, x, yy, sz, bold, color, align){ if (dry) return; font(sz,bold); cx.fillStyle = color||'#1D3256'; cx.textAlign = align||'left'; cx.textBaseline = 'top'; cx.fillText(str, x, yy); cx.textAlign='left'; }
  // table: cols = widths (fractions), rows = [[cell…]], o = {head:bool, shade:[colIdx], align:[…], bold:[colIdx], foot:bool}
  function table(cols, rows, o){
    o = o || {}; var pad = 5, lh = fs*1.42;
    var ws = cols.map(function(f){ return f*CW; });
    rows.forEach(function(row, ri){
      var isHead = o.head && ri===0, isFoot = o.foot && ri===rows.length-1, cells = [], nl = 1;
      row.forEach(function(c, ci){ var bold = isHead || isFoot || (o.bold && o.bold.indexOf(ci)>=0);
        var lines = wrap(c, ws[ci]-2*pad, isHead ? fs-1 : fs, bold); cells.push({l:lines,b:bold}); nl = Math.max(nl, lines.length); });
      var rh = nl*lh + 2*pad - 2, x = X;
      if (!dry){
        cells.forEach(function(c, ci){
          var bg = isHead ? '#172B68' : isFoot ? '#F2ECE0' : (o.shade && o.shade.indexOf(ci)>=0) ? '#EEF1FA' : (ri%2===0 ? '#FFFFFF' : '#FAF8F3');
          cx.fillStyle = bg; cx.fillRect(x, y, ws[ci], rh);
          cx.strokeStyle = '#B5B5AF'; cx.lineWidth = 0.6; cx.strokeRect(x, y, ws[ci], rh);
          var al = (o.align && o.align[ci]) || 'left', tx = al==='center' ? x+ws[ci]/2 : x+pad;
          c.l.forEach(function(ln, li){ text(ln, tx, y+pad+li*lh, isHead ? fs-1 : fs, c.b, isHead ? '#FFFFFF' : (o.shade && o.shade.indexOf(ci)>=0) ? '#5A6378' : '#1D3256', al); });
          x += ws[ci];
        });
      }
      y += rh;
    });
  }
  function section(title){ y += fs*0.9; text(title, X, y, fs+2.5, true, '#172B68'); y += (fs+2.5)*1.35;
    if (!dry){ cx.fillStyle = '#E7A740'; cx.fillRect(X, y, 46, 2); } y += 7; }

  // ---- header
  y = M - 6;
  var lh0 = 52, lw = logo ? lh0 * logo.width / logo.height : 0;
  if (logo && !dry) cx.drawImage(logo, X, y, lw, lh0);
  text(P.title, W - M, y + 6, 17, true, '#172B68', 'right');
  text(P.org, W - M, y + 30, 12.5, false, '#5A6378', 'right');
  y += lh0 + 8; if (!dry){ cx.fillStyle = '#E7A740'; cx.fillRect(X, y, CW, 2.5); } y += 10;

  // ---- meta strip
  var st = r.status==='sent' ? P.st_sent : r.status==='pending' ? P.st_pending : P.st_draft;
  table([.16,.34,.16,.34], [[P.id, r.id, P.status, st], [P.subAt, fmtFull(r.submittedAt), P.by, (S.user.name||'') + (S.user.phone ? ' (' + S.user.phone + ')' : '')]]
    .concat(r.recordType==='Correction' ? [[P.corr, r.parentId||'', '', '']] : []), {shade:[0,2], bold:[1,3]});

  // ---- school & VT
  section(P.s1);
  var g = d.vtGender ? T[S.lang][d.vtGender.toLowerCase()] || d.vtGender : '';
  table([.16,.34,.16,.34], [
    [t('q_udise'), d.udise, t('q_school'), d.school],
    [t('q_district'), dLabel(d.district), t('q_block'), d.block],
    [t('q_vtName'), d.vtName, t('q_vtPhone'), d.vtPhone],
    [t('q_vtGender'), g, t('q_sector'), sLabel(d.sector)],
    [t('q_vtp'), d.vtp + (r.vtpNew ? ' ' + P.vtpNew : ''), t('q_classes'), d.classes.slice().sort(function(a,b){return a-b;}).map(function(c){ return c; }).join(', ')]
  ], {shade:[0,2], bold:[1,3]});

  // ---- enrolment
  section(P.s2);
  table([.16,.42,.42], [[P.cls, P.ce, P.ve]], {head:true, align:['left','center','center']});
  var er = [['', P.b, P.g, P.t, P.b, P.g, P.t]], z = {cb:0,cg:0,vb:0,vg:0};
  d.classes.slice().sort(function(a,b){return a-b;}).forEach(function(c){ var e = d.enrol[c]||{};
    for (var k in z) z[k] += num(e[k]);
    er.push([t('cls',{n:c}), num(e.cb), num(e.cg), num(e.cb)+num(e.cg), num(e.vb), num(e.vg), num(e.vb)+num(e.vg)]); });
  er.push([P.all, z.cb, z.cg, z.cb+z.cg, z.vb, z.vg, z.vb+z.vg]);
  table([.16,.2,.11,.11,.2,.11,.11], er, {head:true, foot:true, align:['left','center','center','center','center','center','center']});

  // ---- places
  section(P.s3 + ' (' + d.nPlaces + ')');
  var pr = [[P.no, P.owner, P.addr, P.pin, P.mob, P.mail]];
  d.places.forEach(function(p, i){ pr.push([i+1, p.owner||'', p.addr||'', p.pin||'', p.phone||'', p.email||'—']); });
  table([.06,.19,.34,.1,.13,.18], pr, {head:true, align:['center','left','left','center','center','left']});

  // ---- change log
  if (r.changes && r.changes.length){ section(P.s4); table([1], r.changes.map(function(c){ return [c]; })); }

  // ---- footer
  y += 12;
  text(P.gen + ': ' + fmtFull(nowISO()) + '   ·   v' + APP_VERSION, X, Math.max(y, H - 30), 10, false, '#5A6378');
  return y + 14;
}
function fmtFull(ts){ return ts ? ts.slice(8,10)+'-'+ts.slice(5,7)+'-'+ts.slice(0,4)+' '+ts.slice(11,16) : '—'; }
function jpegToPdf(dataUrl, pw, ph){
  var bin = atob(dataUrl.split(',')[1]), img = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) img[i] = bin.charCodeAt(i);
  var A4w = 595.28, A4h = 841.89, parts = [], len = 0, offs = [];
  function add(x){ var u = typeof x === 'string' ? new Uint8Array(x.split('').map(function(c){ return c.charCodeAt(0) & 255; })) : x; parts.push(u); len += u.length; }
  function obj(n, body){ offs[n] = len; add(n + ' 0 obj\n' + body + '\nendobj\n'); }
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+A4w+' '+A4h+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  offs[4] = len; add('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+pw+' /Height '+ph+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+img.length+' >>\nstream\n'); add(img); add('\nendstream\nendobj\n');
  var cs = 'q '+A4w+' 0 0 '+A4h+' 0 0 cm /Im0 Do Q';
  obj(5, '<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  obj(6, '<< /Producer (Samagra Shiksha OJT-EV App) /Title (OJT EV Pre-information) >>');
  var xref = len, x = 'xref\n0 7\n0000000000 65535 f \n';
  for (var n=1;n<=6;n++) x += ('0000000000' + offs[n]).slice(-10) + ' 00000 n \n';
  add(x + 'trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n' + xref + '\n%%EOF');
  return new Blob(parts, {type:'application/pdf'});
}

function payload(r){
  var d = cleanData(r.data), edited = r.recordType==='Correction' || (r.changes && r.changes.length);
  return {id:r.id, parentId:r.parentId||'', recordType:r.recordType, deviceSubmittedAt:r.submittedAt, surveyorName:S.user.name, surveyorPhone:S.user.phone,
    udise:d.udise, school:d.school, district:d.district, block:d.block, vtName:d.vtName.trim(), vtPhone:d.vtPhone, vtGender:d.vtGender,
    sector:d.sector, vtp:d.vtp.trim(), vtpIsOther:r.vtpNew!==undefined ? r.vtpNew : !vtpKnown(d.vtp),
    classes:d.classes.slice().sort(function(a,b){return a-b;}),
    enrol:d.classes.slice().sort(function(a,b){return a-b;}).map(function(c){ var e=d.enrol[c]||{}; return {cls:c, cb:num(e.cb), cg:num(e.cg), ct:num(e.cb)+num(e.cg), vb:num(e.vb), vg:num(e.vg), vt:num(e.vb)+num(e.vg)}; }),
    nPlaces:+d.nPlaces, places:d.places.map(function(p,i){ return {no:i+1, owner:(p.owner||'').trim(), addr:(p.addr||'').trim(), pin:p.pin||'', phone:p.phone||'', email:(p.email||'').trim()}; }),
    editedBy: edited ? S.user.name : '', editedAt: edited ? r.submittedAt : '', changes:(r.changes||[]).join(' | '), lang:S.lang, appVersion:APP_VERSION};
}
function post(body){
  return new Promise(function(res, rej){
    var done = false, to = setTimeout(function(){ if(!done){ done=true; rej(new Error('timeout')); } }, 30000);
    fetch(S.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body), redirect:'follow'})
      .then(function(r){ return r.json(); })
      .then(function(j){ if(!done){ done=true; clearTimeout(to); res(j); } })
      .catch(function(e){ if(!done){ done=true; clearTimeout(to); rej(e); } });
  });
}
function syncAll(manual, onlyId){
  if (S.syncing) return;
  var list = S.recs.filter(function(r){ return r.status==='pending' && (!onlyId || r.id===onlyId); });
  if (!list.length) return;
  if (!S.url){ if (manual) toast(t('noServer')); return; }
  if (!navigator.onLine){ if (manual) toast(t('noNet')); return; }
  S.syncing = true; renderHeader();
  var ok = 0, i = 0;
  (function nxt(){
    if (i>=list.length){ S.syncing=false; persist(); if (manual || ok) toast(ok===list.length ? t('sentOk',{n:ok}) : t('sendFail')); if (S.view!=='form') render(); else renderHeader(); return; }
    var r = list[i++];
    post({action:'submit', record:payload(r)}).then(function(j){
      if (j && j.ok){ r.status='sent'; r.sentAt=nowISO(); r.lastError=''; ok++; } else { r.lastError = (j && j.error) || 'server error'; }
      persist(); nxt();
    }, function(e){ r.lastError = (e && e.message) || 'network'; persist(); nxt(); });
  })();
}
function fetchLists(){
  if (!S.url || !navigator.onLine) return;
  fetch(S.url + (S.url.indexOf('?')<0?'?':'&') + 'action=lists').then(function(r){ return r.json(); }).then(function(j){
    if (!j || !j.ok) return;
    if (j.vtp){ S.vtp = j.vtp; ls('sl_vtp', S.vtp);
      S.vtpLocal = S.vtpLocal.filter(function(x){ return !j.vtp.some(function(y){ return vKey(y)===vKey(x); }); }); ls('sl_vtp_local', S.vtpLocal); }
    if (j.orders){ S.orders = j.orders.length ? j.orders : DEPT_ORDERS_DEFAULT; ls('sl_orders', S.orders); }
    if (j.general){ S.general = (j.general.hi && j.general.hi.length) || (j.general.en && j.general.en.length) ? j.general : null; ls('sl_general', S.general); }
    if (j.instr){ S.instr = (j.instr.hi && j.instr.hi.length) || (j.instr.en && j.instr.en.length) ? j.instr : null; ls('sl_instr', S.instr); }
    if (S.view==='home' || S.view==='info') render();
  }).catch(function(){});
}
function downloadBackup(){
  var data = {exportedAt:nowISO(), surveyor:S.user, appVersion:APP_VERSION, records:S.recs.filter(function(r){ return r.status!=='draft'; }).map(function(r){ return {status:r.status, payload:payload(r)}; })};
